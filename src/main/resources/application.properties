# =============================================
# Server
# =============================================
server.port=${SERVER_PORT:8080}
spring.application.name=family-league

# =============================================
# Database — set these in your environment
# =============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================
# Flyway
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================
# JWT — set secret in your environment
# =============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================
# Email (SMTP) — set credentials in environment
# =============================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}

# =============================================
# Prediction lock windows
# =============================================
app.prediction.match-lock-minutes=${MATCH_LOCK_MINUTES:60}
app.prediction.league-lock-hours=${LEAGUE_LOCK_HOURS:4}

# =============================================
# Reminder email (minutes before lock)
# =============================================
app.notification.reminder-before-lock-minutes=${REMINDER_BEFORE_LOCK_MINUTES:30}

# =============================================
# Logging
# =============================================
logging.level.root=INFO
logging.level.com.familyleague=DEBUG
logging.file.name=logs/family-league.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# Scheduler rates (ms)
# =============================================
app.scheduler.lock-check-rate-ms=60000
app.scheduler.reminder-check-rate-ms=300000

# =============================================
# OpenAPI / Swagger UI
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
